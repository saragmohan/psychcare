name: Build Mobile Release (Play Store & App Store)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (Release AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Build Android APK (Release APK)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psychcare-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Android APK (.apk) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psychcare-release-apk
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS App Archive
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Check iOS Xcode Project Structure
        run: |
          ls -la ios/App
